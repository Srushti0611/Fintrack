<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack - Budgets</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">💰 FinTrack</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="income.html">Income</a>
      <a href="expenses.html">Expenses</a>
      <a href="transactions.html">Transactions</a>
      <a href="budgets.html" class="active">Budgets</a>
      <a href="savings.html">Savings</a>
      <a href="analytics.html">Analytics</a>
      <a href="profile.html">Profile</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="content">
    <h1>Budget Management</h1>

    <!-- Add Budget Form -->
    <form id="budgetForm" class="form-card">
      <label>Category</label>
      <select id="category">
        <option>Food</option>
        <option>Shopping</option>
        <option>Transportation</option>
        <option>Bills</option>
        <option>Entertainment</option>
        <option>Healthcare</option>
        <option>Education</option>
        <option>Travel</option>
        <option>Rent</option>
        <option>Other</option>
      </select>

      <label>Monthly Limit (₹)</label>
      <input type="number" id="limit" required>

      <button type="submit" class="btn-primary">Set Budget</button>
    </form>

    <!-- Budget List -->
    <h2>Budgets</h2>
    <div id="budgetList"></div>
  </main>

  <script src="js/budgets.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
