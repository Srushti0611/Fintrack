<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack - Savings</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">💰 FinTrack</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="income.html">Income</a>
      <a href="expenses.html">Expenses</a>
      <a href="transactions.html">Transactions</a>
      <a href="budgets.html">Budgets</a>
      <a href="savings.html" class="active">Savings</a>
      <a href="analytics.html">Analytics</a>
      <a href="profile.html">Profile</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="content">
    <h1>Savings Goals</h1>

    <!-- Add Savings Goal Form -->
    <form id="savingsForm" class="form-card">
      <label>Goal Name</label>
      <input type="text" id="goal" required>

      <label>Target Amount (₹)</label>
      <input type="number" id="target" required>

      <button type="submit" class="btn-primary">Add Goal</button>
    </form>

    <!-- Savings Goals List -->
    <h2>My Goals</h2>
    <div id="savingsList"></div>
  </main>

  <script src="js/savings.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
