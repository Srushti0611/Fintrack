<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack - Income</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">💰 FinTrack</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="income.html" class="active">Income</a>
      <a href="expenses.html">Expenses</a>
      <a href="transactions.html">Transactions</a>
      <a href="budgets.html">Budgets</a>
      <a href="savings.html">Savings</a>
      <a href="analytics.html">Analytics</a>
      <a href="profile.html">Profile</a>
      <a href="settings.html">Settings</a>
    </nav>
  </aside>

  <!-- Main -->
  <main class="content">
    <h1>Income Management</h1>

    <!-- Add Income Form -->
    <form id="incomeForm" class="form-card">
      <label>Amount (₹)</label>
      <input type="number" id="amount" required>

      <label>Source</label>
      <input type="text" id="source" required>

      <label>Category</label>
      <select id="category">
        <option>Salary</option>
        <option>Freelance</option>
        <option>Business</option>
        <option>Investment</option>
        <option>Bonus</option>
        <option>Other</option>
      </select>

      <label>Date</label>
      <input type="date" id="date" required>

      <label>Description</label>
      <input type="text" id="description">

      <button type="submit" class="btn-primary">Add Income</button>
    </form>

    <!-- Income History -->
    <h2>Income History</h2>
    <table id="incomeTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Source</th>
          <th>Category</th>
          <th>Description</th>
          <th>Amount</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="js/supabase.js"></script>
  <script src="js/income.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
